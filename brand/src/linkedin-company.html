<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<title>GEMIS Studio — LinkedIn company cover 1128x191</title>
<style>
/* LinkedIn company page cover. 1128x191.
   The company logo badge sits over the lower left, so copy starts at x=248. */
#c{width:1128px;height:191px}
#c .facets{background-position:76% 48%;background-size:150% auto;left:56%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 26%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 26%)}
#c .veil{background:linear-gradient(90deg,
  rgba(238,240,243,1) 0%, rgba(238,240,243,1) 40%, rgba(238,240,243,.9) 54%,
  rgba(238,240,243,.4) 72%, rgba(238,240,243,.05) 88%, rgba(238,240,243,0) 100%)}

.block{position:absolute;left:248px;top:0;height:191px;display:flex;align-items:center;gap:34px}
.lockup{gap:11px}
.mark{gap:3px;width:21px}
.mark i{height:4px}
.mark i:nth-child(1){width:21px}
.mark i:nth-child(2){width:14px}
.mark i:nth-child(3){width:8px}
.lockup__word b{font-size:14px}
.lockup__word i{font-size:9px;margin-top:3px}

.rule{width:1px;height:62px;background:#c9cbd2}

.display{font-size:34px}
.meta{font-size:11px;margin-top:12px;gap:11px}

.guide--avatar{left:44px;top:74px;width:150px;height:150px;border-radius:8px}
.guide--crop{left:200px;width:728px}
</style></head>
<body><div class="canvas" id="c">
  <div class="facets"></div>
  <div class="veil"></div>

  <div class="block">
    <div class="lockup">
      <span class="mark"><i></i><i></i><i></i></span>
      <span class="lockup__word"><b>GEMIS</b><i>STUDIO</i></span>
    </div>
    <span class="rule"></span>
    <div>
      <h1 class="display">Designed to be <em>built.</em></h1>
      <p class="meta"><span>SANDTON, JHB</span><s>/</s><span>TEARDOWN R6,500</span></p>
    </div>
  </div>

  <span class="guide guide--avatar"></span>
  <span class="guide guide--crop"></span>
</div></body></html>
