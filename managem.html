    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;

<body>
  <!-- Redirect stub. ManaGEM moved to ManaGEM in the GEMIS Stories update.
       The stub keeps older inbound links, bookmarks and search results working
       instead of 404ing. The script below carries the hash across, so a deep
       link to an anchor lands on the matching anchor at the new address. -->
  <div class="b">
    <h1>ManaGEM is now ManaGEM</h1>
    <p>This page moved to <strong>solutions/managem/</strong>. You should be redirected automatically.</p>
    <a href="solutions/managem/">Go to ManaGEM</a>
  </div>
  <script>
    (function () {
      var target = "solutions/managem/";
      // keep the anchor: services.html#process lands on .../#process
      location.replace(target + location.hash);
    })();
  </script>
</body>
